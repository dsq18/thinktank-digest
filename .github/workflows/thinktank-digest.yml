name: ThinkTank Digest

on:
  schedule:
    # 每天 08:00 Asia/Singapore = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:  # 支持手动触发

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify required secrets
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          missing=0
          [ -z "$EMAIL_ADDRESS" ] && echo "Missing secret: EMAIL_ADDRESS" && missing=1
          [ -z "$EMAIL_AUTH_CODE" ] && echo "Missing secret: EMAIL_AUTH_CODE" && missing=1
          [ -z "$EMAIL_TO" ] && echo "Missing secret: EMAIL_TO" && missing=1
          exit $missing

      - name: Run compile check
        run: python -m compileall thinktank_digest tests

