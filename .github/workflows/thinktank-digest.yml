name: ThinkTank Digest

on:
  schedule:
    # GitHub Actions cron is UTC. 00:00 UTC = 08:00 Asia/Singapore.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thinktank-digest-daily
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EMAIL_SMTP_HOST: smtp.163.com
      EMAIL_SMTP_PORT: "465"
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data
          key: ${{ runner.os }}-thinktank-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-thinktank-db-

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run compile check
        run: python -m compileall thinktank_digest tests

      - name: Run tests
        run: python -m pytest

      - name: Validate OpenAI API key
        run: |
          [ -n "$OPENAI_API_KEY" ] || (echo "Missing secret: OPENAI_API_KEY" && exit 1)

      - name: Validate NetEase SMTP environment
        run: thinktank-digest check-email-env

      - name: Generate and send daily digest
        run: >
          thinktank-digest run
          --max-articles 80
          --html-out reports/latest.html
          --text-out reports/latest.txt

      - name: Upload generated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thinktank-digest-report
          path: reports/
          if-no-files-found: ignore
