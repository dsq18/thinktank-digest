name: Daily ThinkTank Digest

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore SQLite state
        uses: actions/cache@v4
        with:
          path: data
          key: thinktank-digest-db-${{ github.run_id }}
          restore-keys: |
            thinktank-digest-db-

      - name: Automated self-review
        run: thinktank-digest --db data/self_review.sqlite self-review --out-dir reports/self-review

      - name: Check NetEase SMTP environment
        env:
          EMAIL_SMTP_HOST: smtp.163.com
          EMAIL_SMTP_PORT: "465"
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: thinktank-digest check-email-env

      - name: Send digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SMTP_HOST: smtp.163.com
          EMAIL_SMTP_PORT: "465"
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: thinktank-digest run
