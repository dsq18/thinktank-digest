[project]
name = "thinktank-digest"
version = "0.1.0"
description = "Daily Chinese geopolitical intelligence briefings from international think tanks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "jinja2>=3.1.4",
  "openai>=1.40.0",
  "python-dateutil>=2.9.0.post0",
  "pyyaml>=6.0.2",
  "tenacity>=8.5.0",
  "trafilatura>=1.12.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
]

[project.scripts]
thinktank-digest = "thinktank_digest.cli:main"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["thinktank_digest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
